variables:
  ARTIFACTORY_URL: artifactory.exness.io
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"
  MAVEN_OPTS: "-Xmx6g -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
  TRINO_VERSION: "475"  # Base Trino version

stages:
  - build
  - deploy

.version_setup_main: &version_setup_main
  - |
    if [ -n "$CI_COMMIT_TAG" ]; then
      # For tagged builds, use the tag directly as version
      export ARTIFACT_VERSION="${CI_COMMIT_TAG}"
    else
      # For main branch, use TRINO_VERSION.minor format
      # Get the latest tag that matches our version pattern
      git fetch --tags
      LAST_TAG=$(git tag -l "${TRINO_VERSION}.*" | sort -V | tail -n1)

      if [ -z "$LAST_TAG" ]; then
        # No existing tags, start with .1
        export ARTIFACT_VERSION="${TRINO_VERSION}.1"
      else
        # Extract minor version and increment
        MINOR_VERSION=$(echo $LAST_TAG | cut -d. -f2)
        NEXT_MINOR=$((MINOR_VERSION + 1))
        export ARTIFACT_VERSION="${TRINO_VERSION}.${NEXT_MINOR}"
      fi

      echo "Calculated version: $ARTIFACT_VERSION (based on last tag: ${LAST_TAG:-none})"
    fi

.version_setup_feature: &version_setup_feature
  - export BUILD_TIMESTAMP=$(date +%Y%m%d-%H%M%S)
  - |
    if [ -n "$CI_COMMIT_TAG" ]; then
      # For tagged builds, use the tag directly as version
      export ARTIFACT_VERSION="${CI_COMMIT_TAG}"
    else
      # For feature branches, use TRINO_VERSION-branch-timestamp format
      # CI_COMMIT_REF_SLUG is the branch name sanitized for use in URLs
      export ARTIFACT_VERSION="${TRINO_VERSION}-${CI_COMMIT_REF_SLUG}-${BUILD_TIMESTAMP}"
      echo "Feature branch version: $ARTIFACT_VERSION"
    fi

build-trino:
  stage: build
  image: eclipse-temurin:23-jdk
  before_script:
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ] || [ "$CI_COMMIT_BRANCH" = "master" ] || [ -n "$CI_COMMIT_TAG" ]; then
        echo "Using main branch versioning"
        git fetch --tags
        if [ -n "$CI_COMMIT_TAG" ]; then
          export ARTIFACT_VERSION="${CI_COMMIT_TAG}"
        else
          LAST_TAG=$(git tag -l "${TRINO_VERSION}.*" | sort -V | tail -n1)
          if [ -z "$LAST_TAG" ]; then
            export ARTIFACT_VERSION="${TRINO_VERSION}.1"
          else
            MINOR_VERSION=$(echo $LAST_TAG | cut -d. -f2)
            NEXT_MINOR=$((MINOR_VERSION + 1))
            export ARTIFACT_VERSION="${TRINO_VERSION}.${NEXT_MINOR}"
          fi
        fi
      else
        echo "Using feature branch versioning"
        export BUILD_TIMESTAMP=$(date +%Y%m%d-%H%M%S)
        export ARTIFACT_VERSION="${TRINO_VERSION}-${CI_COMMIT_REF_SLUG}-${BUILD_TIMESTAMP}"
      fi
    - echo "Building version $ARTIFACT_VERSION"
  script:
    - echo "Building Trino plugins and core components..."
    - |
      ./mvnw clean package -DskipTests -Dgit-commit-id.skip=true \
        -pl plugin/trino-postgresql,plugin/trino-vertica,plugin/trino-kafka,plugin/trino-delta-lake,plugin/trino-iceberg,plugin/trino-storage,core/trino-main \
        -am \
        -T 1C

    - mkdir -p artifacts/plugins/postgresql
    - mkdir -p artifacts/plugins/vertica
    - mkdir -p artifacts/plugins/kafka
    - mkdir -p artifacts/plugins/delta-lake
    - mkdir -p artifacts/plugins/iceberg
    - mkdir -p artifacts/plugins/storage
    - mkdir -p artifacts/core

    - |
      if [ -d "plugin/trino-postgresql/target/trino-postgresql-${TRINO_VERSION}" ]; then
        cp -r plugin/trino-postgresql/target/trino-postgresql-${TRINO_VERSION}/*.jar artifacts/plugins/postgresql/ || echo "No JARs found for postgresql"
      else
        echo "PostgreSQL plugin build directory not found"
      fi
    - |
      if [ -d "plugin/trino-vertica/target/trino-vertica-${TRINO_VERSION}" ]; then
        cp -r plugin/trino-vertica/target/trino-vertica-${TRINO_VERSION}/*.jar artifacts/plugins/vertica/ || echo "No JARs found for vertica"
      else
        echo "Vertica plugin build directory not found"
      fi
    - |
      if [ -d "plugin/trino-kafka/target/trino-kafka-${TRINO_VERSION}" ]; then
        cp -r plugin/trino-kafka/target/trino-kafka-${TRINO_VERSION}/*.jar artifacts/plugins/kafka/ || echo "No JARs found for kafka"
      else
        echo "Kafka plugin build directory not found"
      fi
    - |
      if [ -d "plugin/trino-delta-lake/target/trino-delta-lake-${TRINO_VERSION}" ]; then
        cp -r plugin/trino-delta-lake/target/trino-delta-lake-${TRINO_VERSION}/*.jar artifacts/plugins/delta-lake/ || echo "No JARs found for delta-lake"
      else
        echo "Delta Lake plugin build directory not found"
      fi
    - |
      if [ -d "plugin/trino-iceberg/target/trino-iceberg-${TRINO_VERSION}" ]; then
        cp -r plugin/trino-iceberg/target/trino-iceberg-${TRINO_VERSION}/*.jar artifacts/plugins/iceberg/ || echo "No JARs found for iceberg"
      else
        echo "Iceberg plugin build directory not found"
      fi
    - |
      if [ -d "plugin/trino-storage/target/trino-storage-${TRINO_VERSION}" ]; then
        cp -r plugin/trino-storage/target/trino-storage-${TRINO_VERSION}/*.jar artifacts/plugins/storage/ || echo "No JARs found for storage"
      else
        echo "Storage plugin build directory not found"
      fi

    - |
      if [ -f "core/trino-main/target/trino-main-${TRINO_VERSION}.jar" ]; then
        cp core/trino-main/target/trino-main-${TRINO_VERSION}.jar artifacts/core/
        echo "Core component trino-main copied successfully"
      else
        echo "WARNING: trino-main JAR not found"
      fi

    - echo "=== Build Artifacts Summary ==="
    - find artifacts -type f -name "*.jar" | sort

    - echo "ARTIFACT_VERSION=$ARTIFACT_VERSION" > build.env

  artifacts:
    paths:
      - artifacts/
    expire_in: 1 day
    reports:
      dotenv: build.env
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'
      when: on_success
    - if: '$CI_COMMIT_TAG'
      when: on_success
    - when: manual

deploy-to-artifactory-manual:
  stage: deploy
  image: artifactory.exness.io/golden-images/maven:3.9.7-eclipse-temurin-17-jdk
  id_tokens:
    JFROG_ID_TOKEN:
      aud: https://$ARTIFACTORY_URL/
  dependencies:
    - build-trino
  rules:
    - if: '$CI_COMMIT_BRANCH != "main" && $CI_COMMIT_BRANCH != "master" && $CI_COMMIT_TAG == null'
      when: manual
  before_script:
    - *version_setup_feature
    - echo "Deploying version $ARTIFACT_VERSION to Artifactory..."
    - apt-get update -q && apt-get install -yq --no-install-recommends wget jq
    - |
      JFROG_ACCESS_TOKEN=$(wget --quiet \
        --header="Content-Type: application/json" \
        --post-data='{
          "grant_type": "urn:ietf:params:oauth:grant-type:token-exchange",
          "subject_token_type": "urn:ietf:params:oauth:token-type:id_token",
          "subject_token": "'$JFROG_ID_TOKEN'",
          "provider_name": "gitlab-oidc"
        }' \
        --output-document - \
        "https://${ARTIFACTORY_URL}/access/api/v1/oidc/token" | jq -r .access_token)
    - mkdir -p ~/.m2
    - |
      cat > ~/.m2/settings.xml << EOF
      <?xml version="1.0" encoding="UTF-8"?>
      <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                http://maven.apache.org/xsd/settings-1.0.0.xsd">
        <servers>
          <server>
            <id>exness-artifactory</id>
            <username>$GITLAB_USER_LOGIN</username>
            <password>$JFROG_ACCESS_TOKEN</password>
          </server>
        </servers>
      </settings>
      EOF
    - chmod 600 ~/.m2/settings.xml
  script:
    - |
      apt-get update -qq && apt-get install -yqq zip

      check_artifact_exists() {
        local GROUP_ID="$1"
        local ARTIFACT_ID="$2"
        local VERSION="$3"
        local PACKAGING="$4"

        local GROUP_PATH=$(echo "$GROUP_ID" | tr '.' '/')
        local URL="https://${ARTIFACTORY_URL}/artifactory/maven-big-data-federated/${GROUP_PATH}/${ARTIFACT_ID}/${VERSION}/${ARTIFACT_ID}-${VERSION}.${PACKAGING}"

        echo "Checking if artifact exists: $URL"

        if wget --spider --quiet \
             --header="Authorization: Bearer $JFROG_ACCESS_TOKEN" \
             "$URL" 2>/dev/null; then
          return 0  # Exists
        else
          return 1  # Does not exist
        fi
      }

      for plugin in postgresql vertica kafka delta-lake iceberg storage; do
        echo "=== Deploying $plugin plugin ==="
        PLUGIN_DIR="artifacts/plugins/$plugin"

        if [ -d "$PLUGIN_DIR" ] && [ "$(ls -A $PLUGIN_DIR 2>/dev/null)" ]; then
          if check_artifact_exists "com.exness.trino" "trino-${plugin}-complete" "$ARTIFACT_VERSION" "zip"; then
            echo "WARNING: Artifact trino-${plugin}-complete version $ARTIFACT_VERSION already exists in Artifactory. Skipping..."
            continue
          fi

          cd "$PLUGIN_DIR"
          zip -r /tmp/trino-${plugin}-${ARTIFACT_VERSION}.zip *.jar
          cd -

          cat > /tmp/pom-${plugin}.xml << EOF
      <?xml version="1.0" encoding="UTF-8"?>
      <project>
        <modelVersion>4.0.0</modelVersion>
        <groupId>com.exness.trino</groupId>
        <artifactId>trino-${plugin}-complete</artifactId>
        <version>${ARTIFACT_VERSION}</version>
        <packaging>zip</packaging>
      </project>
      EOF

          echo "Deploying ZIP archive for ${plugin}..."
          if mvn deploy:deploy-file \
            -DgroupId=com.exness.trino \
            -DartifactId=trino-${plugin}-complete \
            -Dversion=$ARTIFACT_VERSION \
            -Dpackaging=zip \
            -Dfile=/tmp/trino-${plugin}-${ARTIFACT_VERSION}.zip \
            -DpomFile=/tmp/pom-${plugin}.xml \
            -DrepositoryId=exness-artifactory \
            -Durl=https://${ARTIFACTORY_URL}/artifactory/maven-big-data-federated; then
            echo "Successfully deployed trino-${plugin}-complete-${ARTIFACT_VERSION}.zip"
          else
            echo "ERROR: Failed to deploy ${plugin} plugin (may already exist)"
          fi
        else
          echo "No JARs found for $plugin plugin"
        fi
      done

      echo "=== Deploying core components ==="
      if [ -f "artifacts/core/trino-main-${TRINO_VERSION}.jar" ]; then
        if check_artifact_exists "com.exness.trino" "trino-main" "$ARTIFACT_VERSION" "jar"; then
          echo "WARNING: Artifact trino-main version $ARTIFACT_VERSION already exists in Artifactory. Skipping..."
        else
          echo "Deploying trino-main..."
          if mvn deploy:deploy-file \
            -DgroupId=com.exness.trino \
            -DartifactId=trino-main \
            -Dversion=$ARTIFACT_VERSION \
            -Dpackaging=jar \
            -Dfile=artifacts/core/trino-main-${TRINO_VERSION}.jar \
            -DrepositoryId=exness-artifactory \
            -Durl=https://${ARTIFACTORY_URL}/artifactory/maven-big-data-federated; then
            echo "trino-main deployed successfully"
          else
            echo "ERROR: Failed to deploy trino-main (may already exist)"
          fi
        fi
      else
        echo "WARNING: trino-main JAR not found, skipping"
      fi

      echo "=== Deployment Summary ==="
      echo "All artifacts have been deployed to:"
      echo "https://${ARTIFACTORY_URL}/artifactory/maven-big-data-federated/com/exness/trino/"
      echo "Version: $ARTIFACT_VERSION"

deploy-to-artifactory-auto:
  extends: deploy-to-artifactory-manual
  before_script:
    - *version_setup_main
    - echo "Deploying version $ARTIFACT_VERSION to Artifactory..."
    - apt-get update -q && apt-get install -yq --no-install-recommends wget jq
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'
      when: on_success
    - if: '$CI_COMMIT_TAG'
      when: on_success
