deploy-to-artifactory-manual:
  stage: deploy
  image: artifactory.exness.io/golden-images/maven:3.9.7-eclipse-temurin-17-jdk
  id_tokens:
    JFROG_ID_TOKEN:
      aud: https://$ARTIFACTORY_URL/
  dependencies:
    - build-trino
  rules:
    - if: '$CI_COMMIT_BRANCH != "main" && $CI_COMMIT_BRANCH != "master" && $CI_COMMIT_TAG == null'
      when: manual
  before_script:
    - *version_setup_feature
    - echo "Deploying version $ARTIFACT_VERSION to Artifactory..."
    - apt-get update -q && apt-get install -yq --no-install-recommends wget jq curl
    - echo "=== Starting OIDC Token Exchange ==="
    - |
      JFROG_ACCESS_TOKEN=$(wget --quiet \
        --header="Content-Type: application/json" \
        --post-data='{
          "grant_type": "urn:ietf:params:oauth:grant-type:token-exchange",
          "subject_token_type": "urn:ietf:params:oauth:token-type:id_token",
          "subject_token": "'$JFROG_ID_TOKEN'",
          "provider_name": "gitlab-oidc"
        }' \
        --output-document - \
        "https://${ARTIFACTORY_URL}/access/api/v1/oidc/token" | jq -r .access_token)

    - |
      if [ -z "$JFROG_ACCESS_TOKEN" ] || [ "$JFROG_ACCESS_TOKEN" = "null" ]; then
        echo "ERROR: Failed to obtain access token from Artifactory"
        exit 1
      else
        echo "Successfully obtained access token"
      fi

    # CRITICAL FIX: Use proper authentication format for JFrog access tokens
    - mkdir -p ~/.m2
    - |
      cat > ~/.m2/settings.xml << EOF
      <?xml version="1.0" encoding="UTF-8"?>
      <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                http://maven.apache.org/xsd/settings-1.0.0.xsd">
        <servers>
          <server>
            <id>exness-artifactory</id>
            <username>token</username>
            <password>$JFROG_ACCESS_TOKEN</password>
          </server>
        </servers>
      </settings>
      EOF
    - chmod 600 ~/.m2/settings.xml

    # Test authentication with Maven
    - |
      echo "=== Testing Maven Authentication ==="
      mvn dependency:get \
        -DremoteRepositories=https://${ARTIFACTORY_URL}/artifactory/maven-big-data-federated \
        -DgroupId=junit -DartifactId=junit -Dversion=4.12 \
        -Dtransitive=false || echo "Test download completed"

  script:
    - apt-get update -qq && apt-get install -yqq zip

    # Alternative deployment function using curl if Maven fails
    - |
      deploy_with_curl() {
        local GROUP_ID="$1"
        local ARTIFACT_ID="$2"
        local VERSION="$3"
        local FILE="$4"
        local PACKAGING="$5"

        local GROUP_PATH=$(echo "$GROUP_ID" | tr '.' '/')
        local BASE_URL="https://${ARTIFACTORY_URL}/artifactory/maven-big-data-federated"
        local ARTIFACT_PATH="${GROUP_PATH}/${ARTIFACT_ID}/${VERSION}"

        echo "Deploying ${ARTIFACT_ID} using curl..."

        # Upload the main artifact
        curl -f -X PUT \
          -H "Authorization: Bearer $JFROG_ACCESS_TOKEN" \
          -T "$FILE" \
          "${BASE_URL}/${ARTIFACT_PATH}/${ARTIFACT_ID}-${VERSION}.${PACKAGING}"

        if [ $? -eq 0 ]; then
          echo "Successfully uploaded ${ARTIFACT_ID}-${VERSION}.${PACKAGING}"

          # Generate and upload POM
          cat > /tmp/temp-pom.xml << POM_EOF
      <?xml version="1.0" encoding="UTF-8"?>
      <project>
        <modelVersion>4.0.0</modelVersion>
        <groupId>${GROUP_ID}</groupId>
        <artifactId>${ARTIFACT_ID}</artifactId>
        <version>${VERSION}</version>
        <packaging>${PACKAGING}</packaging>
      </project>
      POM_EOF

          curl -f -X PUT \
            -H "Authorization: Bearer $JFROG_ACCESS_TOKEN" \
            -T /tmp/temp-pom.xml \
            "${BASE_URL}/${ARTIFACT_PATH}/${ARTIFACT_ID}-${VERSION}.pom"

          return 0
        else
          return 1
        fi
      }

    - |
      check_artifact_exists() {
        local GROUP_ID="$1"
        local ARTIFACT_ID="$2"
        local VERSION="$3"
        local PACKAGING="$4"

        local GROUP_PATH=$(echo "$GROUP_ID" | tr '.' '/')
        local URL="https://${ARTIFACTORY_URL}/artifactory/maven-big-data-federated/${GROUP_PATH}/${ARTIFACT_ID}/${VERSION}/${ARTIFACT_ID}-${VERSION}.${PACKAGING}"

        echo "Checking if artifact exists: $URL"

        if curl -f -s -o /dev/null -w "%{http_code}" \
             -H "Authorization: Bearer $JFROG_ACCESS_TOKEN" \
             "$URL" | grep -q "200"; then
          return 0  # Exists
        else
          return 1  # Does not exist
        fi
      }

    # Deploy standard plugins
    - |
      echo "=== Deploying standard plugins ==="
      for plugin in postgresql vertica kafka delta-lake iceberg storage; do
        echo "=== Deploying $plugin plugin ==="
        PLUGIN_DIR="artifacts/plugins/$plugin"

        if [ -d "$PLUGIN_DIR" ] && [ "$(ls -A $PLUGIN_DIR 2>/dev/null)" ]; then
          if check_artifact_exists "com.exness.trino" "trino-${plugin}-complete" "$ARTIFACT_VERSION" "zip"; then
            echo "WARNING: Artifact already exists. Skipping..."
            continue
          fi

          cd "$PLUGIN_DIR"
          zip -r /tmp/trino-${plugin}-${ARTIFACT_VERSION}.zip *.jar
          cd -

          # Try Maven first
          cat > /tmp/pom-${plugin}.xml << EOF
      <?xml version="1.0" encoding="UTF-8"?>
      <project>
        <modelVersion>4.0.0</modelVersion>
        <groupId>com.exness.trino</groupId>
        <artifactId>trino-${plugin}-complete</artifactId>
        <version>${ARTIFACT_VERSION}</version>
        <packaging>zip</packaging>
      </project>
      EOF

          if mvn deploy:deploy-file \
            -DgroupId=com.exness.trino \
            -DartifactId=trino-${plugin}-complete \
            -Dversion=$ARTIFACT_VERSION \
            -Dpackaging=zip \
            -Dfile=/tmp/trino-${plugin}-${ARTIFACT_VERSION}.zip \
            -DpomFile=/tmp/pom-${plugin}.xml \
            -DrepositoryId=exness-artifactory \
            -Durl=https://${ARTIFACTORY_URL}/artifactory/maven-big-data-federated; then
            echo "Successfully deployed with Maven"
          else
            echo "Maven deploy failed, trying curl..."
            if deploy_with_curl "com.exness.trino" "trino-${plugin}-complete" "$ARTIFACT_VERSION" \
              "/tmp/trino-${plugin}-${ARTIFACT_VERSION}.zip" "zip"; then
              echo "Successfully deployed with curl"
            else
              echo "ERROR: Failed to deploy ${plugin}"
            fi
          fi
        fi
      done

    # Deploy custom plugins (similar pattern)
    - |
      echo "=== Deploying custom plugins ==="
      declare -A CUSTOM_PLUGINS=(
        ["random-functions"]="random-functions"
        ["api"]="api"
        ["big-sequence"]="big-sequence"
        ["convert-to-western-digits"]="convert-to-western-digits"
        ["jwt"]="jwt"
      )

      for plugin_dir in "${!CUSTOM_PLUGINS[@]}"; do
        plugin_name="${CUSTOM_PLUGINS[$plugin_dir]}"
        echo "=== Deploying custom plugin: trino-${plugin_name} ==="
        PLUGIN_DIR="artifacts/plugins/$plugin_dir"

        if [ -d "$PLUGIN_DIR" ] && [ "$(ls -A $PLUGIN_DIR 2>/dev/null)" ]; then
          if check_artifact_exists "com.exness.trino" "trino-${plugin_name}-complete" "$ARTIFACT_VERSION" "zip"; then
            echo "WARNING: Artifact already exists. Skipping..."
            continue
          fi

          cd "$PLUGIN_DIR"
          zip -r /tmp/trino-${plugin_name}-${ARTIFACT_VERSION}.zip *.jar
          cd -

          # Use the same Maven-first, curl-fallback approach
          cat > /tmp/pom-${plugin_name}.xml << EOF
      <?xml version="1.0" encoding="UTF-8"?>
      <project>
        <modelVersion>4.0.0</modelVersion>
        <groupId>com.exness.trino</groupId>
        <artifactId>trino-${plugin_name}-complete</artifactId>
        <version>${ARTIFACT_VERSION}</version>
        <packaging>zip</packaging>
      </project>
      EOF

          if mvn deploy:deploy-file \
            -DgroupId=com.exness.trino \
            -DartifactId=trino-${plugin_name}-complete \
            -Dversion=$ARTIFACT_VERSION \
            -Dpackaging=zip \
            -Dfile=/tmp/trino-${plugin_name}-${ARTIFACT_VERSION}.zip \
            -DpomFile=/tmp/pom-${plugin_name}.xml \
            -DrepositoryId=exness-artifactory \
            -Durl=https://${ARTIFACTORY_URL}/artifactory/maven-big-data-federated; then
            echo "Successfully deployed with Maven"
          else
            echo "Maven deploy failed, trying curl..."
            if deploy_with_curl "com.exness.trino" "trino-${plugin_name}-complete" "$ARTIFACT_VERSION" \
              "/tmp/trino-${plugin_name}-${ARTIFACT_VERSION}.zip" "zip"; then
              echo "Successfully deployed with curl"
            else
              echo "ERROR: Failed to deploy ${plugin_name}"
            fi
          fi
        fi
      done

    # Deploy core components
    - |
      echo "=== Deploying core components ==="
      if [ -f "artifacts/core/trino-main-${TRINO_VERSION}.jar" ]; then
        if check_artifact_exists "com.exness.trino" "trino-main" "$ARTIFACT_VERSION" "jar"; then
          echo "WARNING: Artifact already exists. Skipping..."
        else
          if mvn deploy:deploy-file \
            -DgroupId=com.exness.trino \
            -DartifactId=trino-main \
            -Dversion=$ARTIFACT_VERSION \
            -Dpackaging=jar \
            -Dfile=artifacts/core/trino-main-${TRINO_VERSION}.jar \
            -DrepositoryId=exness-artifactory \
            -Durl=https://${ARTIFACTORY_URL}/artifactory/maven-big-data-federated; then
            echo "Successfully deployed with Maven"
          else
            echo "Maven deploy failed, trying curl..."
            if deploy_with_curl "com.exness.trino" "trino-main" "$ARTIFACT_VERSION" \
              "artifacts/core/trino-main-${TRINO_VERSION}.jar" "jar"; then
              echo "Successfully deployed with curl"
            else
              echo "ERROR: Failed to deploy trino-main"
            fi
          fi
        fi
      fi

    - |
      echo "=== Deployment Summary ==="
      echo "Deployment complete. Check Artifactory at:"
      echo "https://${ARTIFACTORY_URL}/artifactory/maven-big-data-federated/com/exness/trino/"
      echo "Version: $ARTIFACT_VERSION"

# Apply the same fixes to the auto deployment job
deploy-to-artifactory-auto:
  extends: deploy-to-artifactory-manual
  before_script:
    - *version_setup_main
    - echo "Deploying version $ARTIFACT_VERSION to Artifactory..."
    - apt-get update -q && apt-get install -yq --no-install-recommends wget jq curl
    - |
      JFROG_ACCESS_TOKEN=$(wget --quiet \
        --header="Content-Type: application/json" \
        --post-data='{
          "grant_type": "urn:ietf:params:oauth:grant-type:token-exchange",
          "subject_token_type": "urn:ietf:params:oauth:token-type:id_token",
          "subject_token": "'$JFROG_ID_TOKEN'",
          "provider_name": "gitlab-oidc"
        }' \
        --output-document - \
        "https://${ARTIFACTORY_URL}/access/api/v1/oidc/token" | jq -r .access_token)
    - |
      if [ -z "$JFROG_ACCESS_TOKEN" ] || [ "$JFROG_ACCESS_TOKEN" = "null" ]; then
        echo "ERROR: Failed to obtain access token from Artifactory"
        exit 1
      fi
    # CRITICAL FIX: Use "token" as username for JFrog access tokens
    - mkdir -p ~/.m2
    - |
      cat > ~/.m2/settings.xml << EOF
      <?xml version="1.0" encoding="UTF-8"?>
      <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                http://maven.apache.org/xsd/settings-1.0.0.xsd">
        <servers>
          <server>
            <id>exness-artifactory</id>
            <username>token</username>
            <password>$JFROG_ACCESS_TOKEN</password>
          </server>
        </servers>
      </settings>
      EOF
    - chmod 600 ~/.m2/settings.xml
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'
      when: on_success
    - if: '$CI_COMMIT_TAG'
      when: on_success
